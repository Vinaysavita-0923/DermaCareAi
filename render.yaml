# Render Blueprint: the API. The database is a free Neon Postgres (its URL
# goes in DATABASE_URL) and the frontend is on Vercel - see README.md.
services:
  - type: web
    name: dermacare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Tables and catalogue are created on first start; both steps are safe to repeat.
    startCommand: alembic upgrade head && python -m scripts.load_catalog && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_FALLBACK_CHAIN
        value: groq,gemini
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
